name: Build & Release BinaryReceptor

on:
  push:
    branches:
      - main
      - master
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--no-deprecation"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  QT_QPA_PLATFORM: "offscreen"

jobs:
  build-and-release:
    name: Build, Test & Release Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Virtual Environment and Build Executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: "offscreen"
        run: |
          Write-Host "[1/5] Setting up clean isolated virtual environment..."
          python -m venv .build_venv
          .build_venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

          Write-Host "[2/5] Running pytest test suite..."
          pytest -v tests/

          Write-Host "[3/5] Compiling standalone executable..."
          python build.py

          Write-Host "[4/5] Explicit post-build executable smoke test verification..."
          & dist\BinaryReceptor.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Executable self-test FAILED with exit code $LASTEXITCODE!"
            exit $LASTEXITCODE
          }
          Write-Host "Executable self-test PASSED successfully."

          Write-Host "[5/5] Creating distribution ZIP archive..."
          Compress-Archive -Path dist/BinaryReceptor.exe,dist/settings.ini -DestinationPath dist/BinaryReceptor-v3.3.0-win64.zip -Force

      - name: Publish Release to GitHub Releases
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'v3.3.0' }
          Write-Host "Publishing release $tag to GitHub Releases page with --latest..."
          if (gh release view $tag 2>$null) {
            gh release upload $tag dist/BinaryReceptor.exe dist/BinaryReceptor-v3.3.0-win64.zip --clobber
            gh release edit $tag --title "BinaryReceptor $tag" --notes "Official Release $tag" --latest
          } else {
            gh release create $tag dist/BinaryReceptor.exe dist/BinaryReceptor-v3.3.0-win64.zip --target "${{ github.sha }}" --title "BinaryReceptor $tag" --notes "Official Release $tag" --latest
          }
