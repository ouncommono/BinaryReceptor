name: Build & Release BinaryReceptor

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--no-deprecation"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-release:
    name: Build, Test & Release Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git init
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch --depth 1 origin "+refs/pull/${{ github.event.number }}/merge:refs/remotes/origin/pr-merge"
            git checkout --force refs/remotes/origin/pr-merge
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            git fetch --depth 1 origin "refs/tags/${{ github.ref_name }}"
            git checkout --force FETCH_HEAD
          } else {
            git fetch --depth 1 origin "${{ github.sha }}"
            git checkout --force FETCH_HEAD
          }

      - name: Setup Virtual Environment and Build Executable
        shell: pwsh
        run: |
          Write-Host "[1/5] Setting up clean isolated virtual environment..."
          python -m venv .build_venv
          .build_venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

          Write-Host "[2/5] Running pytest test suite..."
          pytest -v tests/

          Write-Host "[3/5] Compiling standalone executable..."
          python build.py

          Write-Host "[4/5] Explicit post-build executable smoke test verification..."
          & dist\BinaryReceptor.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Executable self-test FAILED with exit code $LASTEXITCODE!"
            exit $LASTEXITCODE
          }
          Write-Host "Executable self-test PASSED successfully."

          Write-Host "[5/5] Creating distribution ZIP archive..."
          Compress-Archive -Path dist/BinaryReceptor.exe,dist/settings.ini -DestinationPath dist/BinaryReceptor-v3.2.0-win64.zip -Force

      - name: Publish Release to GitHub Releases
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'v3.2.0' }
          Write-Host "Publishing release $tag to GitHub Releases page with --latest..."
          gh release create $tag dist/BinaryReceptor.exe dist/BinaryReceptor-v3.2.0-win64.zip --title "BinaryReceptor $tag" --notes "Official Release $tag" --latest --clobber
